apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aethermint
resources:
  - prometheus/slo-alerts.yaml
  - grafana/aethermint-slos-dashboard.yaml
  - alertmanager/alertmanager-config.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: aethermint
      app.kubernetes.io/part-of: aethermint
      app.kubernetes.io/managed-by: kustomize
