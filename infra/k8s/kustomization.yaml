apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aethermint
resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - mongodb-deployment.yaml
  - mongodb-service.yaml
  - pvc.yaml
  - ingress.yaml
  - hpa.yaml
  # Optional: enable only when the External Secrets Operator is installed in
  # the cluster (see secret-provider.yaml and docs/infrastructure/kubernetes.md).
  # - secret-provider.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: aethermint
      app.kubernetes.io/part-of: aethermint
      app.kubernetes.io/managed-by: kustomize
