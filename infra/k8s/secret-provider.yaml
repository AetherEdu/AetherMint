# Optional: External Secrets Operator template for the aethermint-runtime
# Secret referenced by the deployments.
#
# This is the "configured secrets provider" path: instead of hand-rolling the
# Secret, a platform-managed SecretStore (AWS Secrets Manager, GCP Secret
# Manager, Azure Key Vault, Vault, ...) backs aethermint-runtime and the
# operator keeps it in sync.
#
# Enable it by:
#   1. Installing the External Secrets Operator in the cluster.
#   2. Creating a SecretStore named aethermint-secret-store (provider of your
#      choice) — see https://external-secrets.io/latest/provider/.
#   3. Uncommenting `- secret-provider.yaml` in kustomization.yaml.
#
# Until then, create the plain Secret by hand (documented in
# docs/infrastructure/kubernetes.md); the deployments only require the
# aethermint-runtime Secret to exist with the keys below.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aethermint-runtime
  labels:
    app.kubernetes.io/name: aethermint
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aethermint-secret-store
    kind: SecretStore
  target:
    name: aethermint-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: aethermint/runtime
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: aethermint/runtime
        property: DB_PASSWORD
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: aethermint/runtime
        property: REDIS_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: aethermint/runtime
        property: JWT_SECRET
    - secretKey: STELLAR_SECRET_KEY
      remoteRef:
        key: aethermint/runtime
        property: STELLAR_SECRET_KEY
    - secretKey: STELLAR_HORIZON_URL
      remoteRef:
        key: aethermint/runtime
        property: STELLAR_HORIZON_URL
    - secretKey: STELLAR_RPC_URL
      remoteRef:
        key: aethermint/runtime
        property: STELLAR_RPC_URL
    - secretKey: NEXT_PUBLIC_STELLAR_RECEIVER_ADDRESS
      remoteRef:
        key: aethermint/runtime
        property: NEXT_PUBLIC_STELLAR_RECEIVER_ADDRESS
    - secretKey: ADMIN_PRIVATE_KEY
      remoteRef:
        key: aethermint/runtime
        property: ADMIN_PRIVATE_KEY
