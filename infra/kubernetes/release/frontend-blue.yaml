apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethermint-frontend-blue
  labels:
    app.kubernetes.io/component: frontend
    release.aethermint.io/color: blue
spec:
  replicas: 2
  # Blue-green: the standby color is replaced out-of-band while the active color
  # keeps serving. Recreate guarantees a color never mixes old and new versions.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      release.aethermint.io/color: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        release.aethermint.io/color: blue
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          # Explicit tag, never `latest`. The release pipeline overrides this
          # with the promoted image tag (kubectl set image).
          image: ghcr.io/aetheredu/aethermint-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: aethermint-region
          env:
            # Each color talks only to its own backend so promotion never mixes
            # a new frontend with an old backend (or vice versa).
            - name: NEXT_PUBLIC_API_URL
              value: http://aethermint-backend-blue:3001
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aethermint-frontend-blue
  labels:
    app.kubernetes.io/component: frontend
    release.aethermint.io/color: blue
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: frontend
    release.aethermint.io/color: blue
  ports:
    - name: http
      port: 80
      targetPort: http
