apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aethermint-backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aethermint-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
