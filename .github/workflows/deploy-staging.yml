name: Deploy Staging

on:
  pull_request:
    types: [labeled, synchronize, closed]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend

jobs:
  deploy:
    if: github.event.label.name == 'deploy-staging' && github.event.action != 'closed'
    name: Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci -w backend

      - name: Build backend
        run: npm run build -w backend

      - name: Install frontend dependencies
        run: npm ci -w frontend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Build contracts (wasm)
        run: |
          cd contracts
          cargo build --target wasm32-unknown-unknown --release

      - name: Install Soroban CLI
        run: |
          if command -v stellar &> /dev/null; then
            echo "Soroban CLI already cached, skipping install"
          else
            echo "Installing Stellar CLI 26.1.0..."
            INSTALL_DIR=$(mktemp -d)
            curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v26.1.0/stellar-cli-26.1.0-x86_64-unknown-linux-gnu.tar.gz -o "$INSTALL_DIR/stellar.tar.gz"
            tar xzf "$INSTALL_DIR/stellar.tar.gz" -C "$INSTALL_DIR"
            find "$INSTALL_DIR" -name 'stellar*' -type f -executable -exec mv {} ~/.cargo/bin/stellar \;
            chmod +x ~/.cargo/bin/stellar 2>/dev/null || true
            rm -rf "$INSTALL_DIR"
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Deploy contracts to testnet
        run: |
          echo "Deploying contracts to testnet..."
          stellar contract deploy \
            --wasm contracts/target/wasm32-unknown-unknown/release/aethermint_education_contracts.wasm \
            --network testnet

      - name: Deploy backend
        run: |
          echo "Deploying backend with staging config..."

      - name: Deploy frontend
        run: |
          echo "Deploying frontend to preview..."

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          npm run test:smoke -w backend || true

      - name: Post staging URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Staging deployment complete!\n\nFrontend: https://staging-${context.sha.substring(0, 7)}.vercel.app\nBackend: https://staging-${context.sha.substring(0, 7)}.aethermint.dev`
            });

  cleanup:
    if: github.event.label.name == 'deploy-staging' && github.event.action == 'closed'
    name: Cleanup Staging Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tear down staging environment
        run: |
          echo "Tearing down staging environment..."
