name: CI/CD Pipeline (PR Safe)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.changes.outputs.contracts }}
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contracts:
              - 'contracts/**'
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci-pr.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci-pr.yml'
            release:
              - 'scripts/**'
              - 'infra/**'
              - 'docs/infrastructure/**'
              - '.github/workflows/ci-pr.yml'
              - '.github/workflows/deploy.yml'

  build-contracts:
    name: Build & Lint Contracts
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-0.22

      - name: Check formatting
        run: cd contracts && cargo fmt --all -- --check

      - name: Run Clippy
        run: cd contracts && cargo clippy -- -D warnings

      - name: Build contracts (release)
        run: cd contracts && cargo build --release

      - name: Build tests (no run)
        run: cd contracts && cargo test --no-run --release
        continue-on-error: true

  test-contracts:
    name: Test Contracts (${{ matrix.test-group }})
    needs: build-contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-group:
          - unit
          - integration
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Run ${{ matrix.test-group }} tests
        run: |
          if [ "${{ matrix.test-group }}" = "integration" ]; then
            cd contracts && cargo test --test '*' --release
          else
            cd contracts && cargo test --lib --release
          fi

  spec-test-contracts:
    name: Spec Tests — Bounded Model Checking
    needs: build-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Run specification-based tests (Issue #425)
        # Runs only the *_spec_test modules so results are surfaced separately
        # from unit tests and the output is easier to read in CI.
        run: |
          cd contracts && cargo test --lib --release \
            -- spec_ --nocapture 2>&1 | tee /tmp/spec-test-output.txt
          # Fail the job if any spec violation was detected.
          if grep -q "FAILED\|panicked at" /tmp/spec-test-output.txt; then
            echo "::error::One or more specification invariants were violated. See output above."
            exit 1
          fi

      - name: Upload spec test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-test-report
          path: /tmp/spec-test-output.txt
          retention-days: 30

  build-backend:
    name: Build Backend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Verify lock file
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: root package-lock.json is missing. Run 'npm install --package-lock-only' in the project root"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci -w backend

      - name: Run backend linter
        run: npm run lint -w backend 2>/dev/null || echo "No linter configured for backend"

      - name: Build backend
        run: npm run build -w backend

      - name: Cache backend build
        uses: actions/cache@v4
        with:
          path: backend/.next
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/**/*.ts', 'backend/**/*.tsx', 'backend/package-lock.json') }}
          enable-cross-os-access: true

  test-backend:
    name: Test Backend
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci -w backend

      - name: Run backend tests
        run: npm test -w backend 2>/dev/null || echo "No tests configured for backend"

  build-frontend:
    name: Build Frontend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Verify lock file
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: root package-lock.json is missing. Run 'npm install --package-lock-only' in the project root"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci -w frontend

      - name: Build frontend
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_STELLAR_RECEIVER_ADDRESS: ${{ secrets.NEXT_PUBLIC_STELLAR_RECEIVER_ADDRESS || 'GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWNA' }}

  validate-release-tooling:
    name: Validate Release Tooling
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: bash -n scripts/deploy-blue-green.sh scripts/deploy-canary.sh scripts/rollback-release.sh scripts/update-release-state.sh scripts/test-release.sh

      - name: Run release dry-run tests
        run: scripts/test-release.sh

  security-scan:
    name: Security Scan
    needs: detect-changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies (for audit)
        run: npm ci --ignore-scripts

      - name: npm audit (report only, non-blocking)
        run: npm audit --audit-level=critical --workspaces --include-workspace-root || echo "npm audit found issues (non-blocking)"

      - name: Setup Rust for cargo-audit
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-0.22

      - name: Install cargo-audit (if not cached)
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version ^0.22 --force

      - name: cargo audit (Rust dependencies, non-blocking)
        working-directory: contracts
        run: cargo audit || echo "cargo audit found issues (non-blocking)"

      - name: Run Trivy vulnerability scanner (report only)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: warn

  ci-status:
    name: CI Status Check
    needs:
      - build-contracts
      - test-contracts
      - spec-test-contracts
      - build-backend
      - test-backend
      - build-frontend
      - validate-release-tooling
      - security-scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check build-contracts status
        run: |
          echo "build-contracts: ${{ needs.build-contracts.result }}"
          echo "test-contracts: ${{ needs.test-contracts.result }}"
          echo "spec-test-contracts: ${{ needs.spec-test-contracts.result }}"
          echo "build-backend: ${{ needs.build-backend.result }}"
          echo "test-backend: ${{ needs.test-backend.result }}"
          echo "build-frontend: ${{ needs.build-frontend.result }}"
          echo "validate-release-tooling: ${{ needs.validate-release-tooling.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"

      - name: Fail if any critical job failed
        if: >
          needs.build-contracts.result == 'failure' ||
          needs.spec-test-contracts.result == 'failure' ||
          needs.build-backend.result == 'failure' ||
          needs.build-frontend.result == 'failure' ||
          needs.validate-release-tooling.result == 'failure'
        run: exit 1
