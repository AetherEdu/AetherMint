name: CI

# Canonical build-and-test pipeline for the default branch. It runs on every
# push to `main`/`develop` and can be triggered manually, which is what the
# status badge at the top of README.md reflects.
#
# Pull requests are covered by `ci-pr.yml`, which runs the same checks (plus
# change detection, spec tests, release-tooling validation, and security
# scanning) and uses `pull_request` triggers. Keeping the two workflows split
# avoids running the heavy contract build twice for every PR.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000

jobs:
  contracts:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Build contracts (wasm32v1-none, release)
        run: cargo build --target wasm32v1-none --release

      - name: Run contract tests
        run: cargo test --release

  backend:
    name: Lint, Typecheck & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci -w backend

      - name: Typecheck
        run: npm run typecheck -w backend

      - name: Lint (report only)
        # ESLint currently reports pre-existing findings; report them without
        # failing the pipeline until the backlog is cleared.
        run: npm run lint -w backend || echo "::warning::backend lint reported issues (non-blocking)"

      - name: Run tests
        run: npm test -w backend -- --ci --watchAll=false

  frontend:
    name: Typecheck & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci -w frontend

      - name: Typecheck
        run: npm run type-check -w frontend

      - name: Build
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_STELLAR_RECEIVER_ADDRESS: ${{ secrets.NEXT_PUBLIC_STELLAR_RECEIVER_ADDRESS || 'GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWNA' }}

  ci-status:
    name: CI Status
    if: always()
    needs: [contracts, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize results
        run: |
          echo "contracts: ${{ needs.contracts.result }}"
          echo "backend:   ${{ needs.backend.result }}"
          echo "frontend:  ${{ needs.frontend.result }}"

      - name: Fail if any required job failed
        if: >-
          needs.contracts.result == 'failure' ||
          needs.backend.result == 'failure' ||
          needs.frontend.result == 'failure'
        run: exit 1
