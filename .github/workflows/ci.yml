name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  build-contracts:
    name: Build Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cd contracts
          cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          cd contracts
          cargo clippy -- -D warnings

      - name: Build contracts
        run: |
          cd contracts
          cargo build --release

      - name: Run contract tests
        run: |
          cd contracts
          cargo test

      - name: Verify contract build output
        run: |
          cd contracts
          ls -lh target/release/*.so 2>/dev/null || echo "Library built successfully"

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-libs
          path: contracts/target/release/*.so
          if-no-files-found: warn

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify lock file
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: root package-lock.json is missing. Run 'npm install --package-lock-only' in the project root"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci -w backend

      - name: Build backend
        run: npm run build -w backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify lock file
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: root package-lock.json is missing. Run 'npm install --package-lock-only' in the project root"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci -w frontend

      - name: Build frontend
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_STELLAR_RECEIVER_ADDRESS: ${{ secrets.NEXT_PUBLIC_STELLAR_RECEIVER_ADDRESS || 'GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWNA' }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # ===========================================================================
  # Load Test - Smoke (runs on every PR)
  # ===========================================================================
  load-test-smoke:
    name: Load Test (Smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    needs: [build-backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aethermint_test
          POSTGRES_USER: aethermint
          POSTGRES_PASSWORD: aethermint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci -w backend

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start backend
        run: |
          npm run build -w backend
          cd backend
          NODE_ENV=test PORT=3001 \
            DB_HOST=localhost DB_PORT=5432 DB_NAME=aethermint_test \
            DB_USER=aethermint DB_PASSWORD=aethermint_test \
            REDIS_HOST=localhost REDIS_PORT=6379 \
            node dist/index.js &
          echo $! > backend.pid
        env:
          MONGODB_URI: mongodb://localhost:27017/aethermint_test

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Seed test data
        run: |
          cd backend
          DB_HOST=localhost DB_PORT=5432 DB_NAME=aethermint_test \
          DB_USER=aethermint DB_PASSWORD=aethermint_test \
          SEED_COUNT=50 \
          node ../tests/load/seed-data.js seed
          node ../tests/load/seed-data.js export

      - name: Run smoke test
        run: |
          k6 run \
            -e BASE_URL=http://localhost:3001 \
            -e TEST_DATA_PATH=./tests/load/test-data.json \
            --out json=tests/load/results/smoke-ci.json \
            tests/load/k6-smoke.js

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-smoke-results
          path: |
            tests/load/results/
            tests/load/results/smoke-ci.json
          retention-days: 30

      - name: Cleanup test data
        if: always()
        run: |
          cd backend
          DB_HOST=localhost DB_PORT=5432 DB_NAME=aethermint_test \
          DB_USER=aethermint DB_PASSWORD=aethermint_test \
          node ../tests/load/seed-data.js cleanup || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi

  # ===========================================================================
  # Load Test - Full (runs on merge to main)
  # ===========================================================================
  load-test-full:
    name: Load Test (Full)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aethermint_test
          POSTGRES_USER: aethermint
          POSTGRES_PASSWORD: aethermint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci -w backend

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start backend
        run: |
          npm run build -w backend
          cd backend
          NODE_ENV=test PORT=3001 \
            DB_HOST=localhost DB_PORT=5432 DB_NAME=aethermint_test \
            DB_USER=aethermint DB_PASSWORD=aethermint_test \
            REDIS_HOST=localhost REDIS_PORT=6379 \
            node dist/index.js &
          echo $! > backend.pid
        env:
          MONGODB_URI: mongodb://localhost:27017/aethermint_test

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Seed test data
        run: |
          cd backend
          DB_HOST=localhost DB_PORT=5432 DB_NAME=aethermint_test \
          DB_USER=aethermint DB_PASSWORD=aethermint_test \
          SEED_COUNT=200 \
          node ../tests/load/seed-data.js seed
          node ../tests/load/seed-data.js export

      - name: Run full load test
        run: |
          k6 run \
            -e BASE_URL=http://localhost:3001 \
            -e TEST_DATA_PATH=./tests/load/test-data.json \
            --out json=tests/load/results/full-ci.json \
            tests/load/k6-full.js

      - name: Upload full load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-full-results
          path: |
            tests/load/results/
          retention-days: 90

      - name: Cleanup test data
        if: always()
        run: |
          cd backend
          DB_HOST=localhost DB_PORT=5432 DB_NAME=aethermint_test \
          DB_USER=aethermint DB_PASSWORD=aethermint_test \
          node ../tests/load/seed-data.js cleanup || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi
