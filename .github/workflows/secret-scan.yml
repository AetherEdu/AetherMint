name: Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks (report-only)
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=. --no-git --config=.gitleaks.toml --redact --verbose --no-banner --exit-code 0